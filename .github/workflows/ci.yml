name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://socrates:socrates@localhost:5432/socrates_ci
      MANUAL_RESEARCH_ENABLED: "true"
      CREDENTIALS_DIRECTORY: /run/credentials/socrates-runner-local.service
      SOCRATES_TEST_FIFO: /tmp/socrates-ci-bounded-reader/input.fifo
      SOCRATES_TEST_PUBLIC_DEPLOYMENT: "1"
      SOCRATES_TEST_SYSTEMD_CREDENTIAL: "1"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: socrates_ci
          POSTGRES_PASSWORD: socrates
          POSTGRES_USER: socrates
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socrates -d socrates_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Audit Phase 1 boundaries
        run: pnpm audit:phase-1

      - name: Audit Phase 2 boundaries
        run: pnpm audit:phase-2

      - name: Apply database migrations
        run: pnpm --filter @socrates/database db:migrate

      - name: Seed development workspace
        run: pnpm --filter @socrates/database db:seed-development

      - name: Provision bounded-reader FIFO fixture
        run: |
          install -d -m 0700 "$(dirname "$SOCRATES_TEST_FIFO")"
          mkfifo -m 0444 "$SOCRATES_TEST_FIFO"

      - name: Provision public deployment fixture
        run: |
          sudo install -d -o root -g root -m 0755 /etc/socrates/runner-local
          sudo install -o root -g root -m 0444 .github/fixtures/local-runner/configuration.v1.canonical /etc/socrates/runner-local/configuration.v1.json
          sudo install -o root -g root -m 0444 .github/fixtures/local-runner/trusted-images.v1.canonical /etc/socrates/runner-local/trusted-images.v1.json
          sudo truncate -s -1 /etc/socrates/runner-local/configuration.v1.json
          sudo truncate -s -1 /etc/socrates/runner-local/trusted-images.v1.json

      - name: Provision systemd credential fixture
        run: |
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          sudo install -d -o root -g root -m 0755 /run/credentials
          sudo install -d -o "$runner_uid" -g "$runner_gid" -m 0500 /run/credentials/socrates-runner-local.service
          sudo install -o "$runner_uid" -g "$runner_gid" -m 0400 .github/fixtures/local-runner/runner-bearer-token /run/credentials/socrates-runner-local.service/runner-bearer-token
          sudo truncate -s -1 /run/credentials/socrates-runner-local.service/runner-bearer-token

      - name: Test workspace units
        run: DATABASE_URL= pnpm test

      - name: Test database integrations
        run: pnpm --filter @socrates/database test

      - name: Test API integrations before runner projections
        run: pnpm --filter @socrates/api test

      - name: Test runner integrations
        run: pnpm --filter @socrates/runner-local test

      - name: Validate adversarial public deployment trees
        run: |
          run_failure() {
            SOCRATES_TEST_PUBLIC_DEPLOYMENT_FAILURE="$1" pnpm --filter @socrates/runner-local exec vitest run src/deployment/public-deployment-loader.test.ts
          }

          sudo mv /etc/socrates/runner-local/configuration.v1.json /etc/socrates/runner-local/configuration.v1.real
          run_failure configuration_failed
          sudo mv /etc/socrates/runner-local/configuration.v1.real /etc/socrates/runner-local/configuration.v1.json

          sudo mv /etc/socrates/runner-local/configuration.v1.json /etc/socrates/runner-local/configuration.v1.real
          sudo ln -s configuration.v1.real /etc/socrates/runner-local/configuration.v1.json
          run_failure configuration_failed
          sudo rm -f /etc/socrates/runner-local/configuration.v1.json
          sudo mv /etc/socrates/runner-local/configuration.v1.real /etc/socrates/runner-local/configuration.v1.json

          sudo ln /etc/socrates/runner-local/configuration.v1.json /etc/socrates/runner-local/configuration.v1.alias
          run_failure configuration_failed
          sudo rm -f /etc/socrates/runner-local/configuration.v1.alias

          sudo chmod 0644 /etc/socrates/runner-local/configuration.v1.json
          run_failure configuration_failed
          sudo chmod 0444 /etc/socrates/runner-local/configuration.v1.json

          sudo chown 1:0 /etc/socrates/runner-local/configuration.v1.json
          run_failure configuration_failed
          sudo chown 0:0 /etc/socrates/runner-local/configuration.v1.json

          sudo mv /etc/socrates/runner-local/configuration.v1.json /etc/socrates/runner-local/configuration.v1.real
          sudo install -d -o root -g root -m 0555 /etc/socrates/runner-local/configuration.v1.json
          run_failure configuration_failed
          sudo rmdir /etc/socrates/runner-local/configuration.v1.json
          sudo mv /etc/socrates/runner-local/configuration.v1.real /etc/socrates/runner-local/configuration.v1.json

          sudo mv /etc/socrates/runner-local/configuration.v1.json /etc/socrates/runner-local/configuration.v1.real
          sudo dd if=/dev/zero of=/etc/socrates/runner-local/configuration.v1.json bs=1048577 count=1 status=none
          sudo chmod 0444 /etc/socrates/runner-local/configuration.v1.json
          run_failure configuration_failed
          sudo rm -f /etc/socrates/runner-local/configuration.v1.json
          sudo mv /etc/socrates/runner-local/configuration.v1.real /etc/socrates/runner-local/configuration.v1.json

          printf '\n' | sudo tee -a /etc/socrates/runner-local/configuration.v1.json >/dev/null
          run_failure configuration_failed
          sudo truncate -s -1 /etc/socrates/runner-local/configuration.v1.json

          printf '\n' | sudo tee -a /etc/socrates/runner-local/trusted-images.v1.json >/dev/null
          run_failure trusted_images_failed
          sudo truncate -s -1 /etc/socrates/runner-local/trusted-images.v1.json

          sudo chmod 0775 /etc/socrates/runner-local
          run_failure invalid_metadata
          sudo chmod 0755 /etc/socrates/runner-local

          sudo mv /etc/socrates/runner-local /etc/socrates/runner-local.real
          sudo ln -s runner-local.real /etc/socrates/runner-local
          run_failure open_failed
          sudo rm -f /etc/socrates/runner-local
          sudo mv /etc/socrates/runner-local.real /etc/socrates/runner-local

      - name: Validate adversarial systemd credential trees
        run: |
          run_credential_failure() {
            SOCRATES_TEST_SYSTEMD_CREDENTIAL_FAILURE="$1" pnpm --filter @socrates/runner-local exec vitest run src/deployment/systemd-credential-loader.test.ts
          }

          CREDENTIALS_DIRECTORY=/run/credentials/other.service SOCRATES_TEST_SYSTEMD_CREDENTIAL_FAILURE=invalid_environment pnpm --filter @socrates/runner-local exec vitest run src/deployment/systemd-credential-loader.test.ts

          sudo mv /run/credentials/socrates-runner-local.service/runner-bearer-token /run/credentials/socrates-runner-local.service/runner-bearer-token.real
          run_credential_failure credential_failed
          sudo mv /run/credentials/socrates-runner-local.service/runner-bearer-token.real /run/credentials/socrates-runner-local.service/runner-bearer-token

          sudo mv /run/credentials/socrates-runner-local.service/runner-bearer-token /run/credentials/socrates-runner-local.service/runner-bearer-token.real
          sudo ln -s runner-bearer-token.real /run/credentials/socrates-runner-local.service/runner-bearer-token
          run_credential_failure credential_failed
          sudo rm -f /run/credentials/socrates-runner-local.service/runner-bearer-token
          sudo mv /run/credentials/socrates-runner-local.service/runner-bearer-token.real /run/credentials/socrates-runner-local.service/runner-bearer-token

          sudo ln /run/credentials/socrates-runner-local.service/runner-bearer-token /run/credentials/socrates-runner-local.service/runner-bearer-token.alias
          run_credential_failure credential_failed
          sudo rm -f /run/credentials/socrates-runner-local.service/runner-bearer-token.alias

          sudo chmod 0440 /run/credentials/socrates-runner-local.service/runner-bearer-token
          run_credential_failure credential_failed
          sudo chmod 0400 /run/credentials/socrates-runner-local.service/runner-bearer-token

          sudo chown 0:0 /run/credentials/socrates-runner-local.service/runner-bearer-token
          run_credential_failure credential_failed
          sudo chown "$(id -u):$(id -g)" /run/credentials/socrates-runner-local.service/runner-bearer-token

          sudo mv /run/credentials/socrates-runner-local.service/runner-bearer-token /run/credentials/socrates-runner-local.service/runner-bearer-token.real
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0500 /run/credentials/socrates-runner-local.service/runner-bearer-token
          run_credential_failure credential_failed
          sudo rmdir /run/credentials/socrates-runner-local.service/runner-bearer-token
          sudo mv /run/credentials/socrates-runner-local.service/runner-bearer-token.real /run/credentials/socrates-runner-local.service/runner-bearer-token

          sudo truncate -s 84 /run/credentials/socrates-runner-local.service/runner-bearer-token
          run_credential_failure credential_failed
          sudo install -o "$(id -u)" -g "$(id -g)" -m 0400 .github/fixtures/local-runner/runner-bearer-token /run/credentials/socrates-runner-local.service/runner-bearer-token
          sudo truncate -s -1 /run/credentials/socrates-runner-local.service/runner-bearer-token

          printf 'x' | sudo tee -a /run/credentials/socrates-runner-local.service/runner-bearer-token >/dev/null
          run_credential_failure credential_failed
          sudo truncate -s -1 /run/credentials/socrates-runner-local.service/runner-bearer-token

          printf 'x' | sudo dd of=/run/credentials/socrates-runner-local.service/runner-bearer-token bs=1 seek=0 conv=notrunc status=none
          run_credential_failure credential_failed
          sudo install -o "$(id -u)" -g "$(id -g)" -m 0400 .github/fixtures/local-runner/runner-bearer-token /run/credentials/socrates-runner-local.service/runner-bearer-token
          sudo truncate -s -1 /run/credentials/socrates-runner-local.service/runner-bearer-token

          sudo chmod 0700 /run/credentials/socrates-runner-local.service
          run_credential_failure invalid_metadata
          sudo chmod 0500 /run/credentials/socrates-runner-local.service

          sudo mv /run/credentials/socrates-runner-local.service /run/credentials/socrates-runner-local.service.real
          sudo ln -s socrates-runner-local.service.real /run/credentials/socrates-runner-local.service
          run_credential_failure open_failed
          sudo rm -f /run/credentials/socrates-runner-local.service
          sudo mv /run/credentials/socrates-runner-local.service.real /run/credentials/socrates-runner-local.service

      - name: Remove bounded-reader FIFO fixture
        if: ${{ always() }}
        run: rm -f "$SOCRATES_TEST_FIFO"

      - name: Remove public deployment fixture
        if: ${{ always() }}
        run: |
          if [ -L /etc/socrates/runner-local ]; then
            sudo rm -f /etc/socrates/runner-local
          fi
          for directory in /etc/socrates/runner-local /etc/socrates/runner-local.real; do
            if [ -d "$directory/configuration.v1.json" ] && [ ! -L "$directory/configuration.v1.json" ]; then
              sudo rmdir "$directory/configuration.v1.json"
            else
              sudo rm -f "$directory/configuration.v1.json"
            fi
            sudo rm -f "$directory/configuration.v1.real" "$directory/configuration.v1.alias" "$directory/trusted-images.v1.json"
            sudo rmdir "$directory" 2>/dev/null || true
          done
          sudo rmdir /etc/socrates 2>/dev/null || true

      - name: Remove systemd credential fixture
        if: ${{ always() }}
        run: |
          if [ -L /run/credentials/socrates-runner-local.service ]; then
            sudo rm -f /run/credentials/socrates-runner-local.service
          fi
          for directory in /run/credentials/socrates-runner-local.service /run/credentials/socrates-runner-local.service.real; do
            if [ -d "$directory/runner-bearer-token" ] && [ ! -L "$directory/runner-bearer-token" ]; then
              sudo rmdir "$directory/runner-bearer-token"
            else
              sudo rm -f "$directory/runner-bearer-token"
            fi
            sudo rm -f "$directory/runner-bearer-token.real" "$directory/runner-bearer-token.alias"
            sudo rmdir "$directory" 2>/dev/null || true
          done
          sudo rmdir /run/credentials 2>/dev/null || true

      - name: Validate native runner spool durability
        run: pnpm --filter @socrates/runner-local test:native-spool

      - name: Validate native runner work journal durability
        run: pnpm --filter @socrates/runner-local test:native-journal

      - name: Validate native runner control-plane network authority
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.github/fixtures/local-runner/network-ca.pem
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          NODE_USE_ENV_PROXY: "1"
          NO_PROXY: ""
          SOCRATES_TEST_NETWORK_NATIVE: "1"
        run: pnpm --filter @socrates/runner-local test:native-network

      - name: Validate native runner dispatch observation
        run: pnpm --filter @socrates/runner-local test:native-observation

      - name: Install Chromium
        run: pnpm --filter @socrates/web exec playwright install --with-deps chromium

      - name: Test browser journey
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Upload native runner spool evidence
        if: ${{ always() && hashFiles('services/runner-local/evidence/native/*-spool.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-spool-native-evidence
          path: services/runner-local/evidence/native/*-spool.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload native runner work journal evidence
        if: ${{ always() && hashFiles('services/runner-local/evidence/native/*-journal.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-work-journal-native-evidence
          path: services/runner-local/evidence/native/*-journal.json
          if-no-files-found: error
          retention-days: 30
