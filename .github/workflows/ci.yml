name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://socrates:socrates@localhost:5432/socrates_ci
      MANUAL_RESEARCH_ENABLED: "true"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: socrates_ci
          POSTGRES_PASSWORD: socrates
          POSTGRES_USER: socrates
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socrates -d socrates_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Audit Phase 1 boundaries
        run: pnpm audit:phase-1

      - name: Apply database migrations
        run: pnpm --filter @socrates/database db:migrate

      - name: Seed development workspace
        run: pnpm --filter @socrates/database db:seed-development

      - name: Test
        run: pnpm test

      - name: Install Chromium
        run: pnpm --filter @socrates/web exec playwright install --with-deps chromium

      - name: Test browser journey
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
