# Manual-only disposable reference-host validation.
name: OCI reference-host spike

on:
  workflow_dispatch:
    inputs:
      image:
        description: Immutable OCI image reference
        required: true
        default: node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
        type: string
      latency_samples:
        description: Cached run/remove sample count
        required: true
        default: "30"
        type: string

permissions:
  contents: read

concurrency:
  group: oci-reference-host
  cancel-in-progress: false

jobs:
  compare:
    name: Compare rootless engines
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ${{ inputs.image }}
      LATENCY_SAMPLES: ${{ inputs.latency_samples }}

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -fc %T /sys/fs/cgroup)" = "cgroup2fs"
          test "$(cat /sys/module/apparmor/parameters/enabled)" = "Y"
          test "$(ps -p 1 -o comm=)" = "systemd"
          test -z "${WSL_DISTRO_NAME:-}"
          uname -a

      - name: Install rootless engine prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            apparmor \
            apparmor-utils \
            ca-certificates \
            curl \
            dbus-user-session \
            fuse-overlayfs \
            podman \
            slirp4netns \
            uidmap
          if ! command -v dockerd-rootless-setuptool.sh >/dev/null; then
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo curl --fail --silent --show-error --location \
              https://download.docker.com/linux/ubuntu/gpg \
              --output /etc/apt/keyrings/docker.asc
            sudo chmod a+r /etc/apt/keyrings/docker.asc
            architecture="$(dpkg --print-architecture)"
            . /etc/os-release
            codename="${UBUNTU_CODENAME:-$VERSION_CODENAME}"
            echo "deb [arch=${architecture} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${codename} stable" |
              sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
            sudo apt-get update
            sudo apt-get install --yes docker-ce-rootless-extras
          fi
          sudo systemctl restart apparmor
          sudo apparmor_status --enabled
          sudo apparmor_status
          sudo apparmor_parser --replace spikes/oci-engine/apparmor/socrates-sandbox
          if ! grep -q "^${USER}:" /etc/subuid; then
            sudo usermod --add-subuids 100000-165535 "$USER"
          fi
          if ! grep -q "^${USER}:" /etc/subgid; then
            sudo usermod --add-subgids 100000-165535 "$USER"
          fi

      - name: Start rootless Docker
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          sudo systemctl stop docker.service docker.socket
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${uid}.service"
          sudo install -d -m 0700 -o "$USER" -g "$USER" "/run/user/${uid}"
          export XDG_RUNTIME_DIR="/run/user/${uid}"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          dockerd-rootless-setuptool.sh install --force
          systemctl --user restart docker
          echo "DOCKER_HOST=unix://${XDG_RUNTIME_DIR}/docker.sock" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS}" >> "$GITHUB_ENV"

      - name: Verify rootless engines
        shell: bash
        run: |
          set -euo pipefail
          docker info --format '{{json .SecurityOptions}}' | grep -q rootless
          test "$(docker info --format '{{.CgroupVersion}}')" = "2"
          test "$(docker info --format '{{.CgroupDriver}}')" = "systemd"
          podman info --format json | jq -e \
            '.host.security.rootless == true and .host.cgroupVersion == "v2"'

      - name: Pre-pull immutable image
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]
          docker pull "$IMAGE"
          podman pull "$IMAGE"

      - name: Probe explicit Podman AppArmor confinement
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          podman run --rm \
            --security-opt apparmor=socrates-sandbox \
            "$IMAGE" \
            sh -c '
              label="$(cat /proc/self/attr/current)"
              printf "label=%s\n" "$label"
              test "$label" = "socrates-sandbox (enforce)"
              ! touch /tmp/socrates-lsm-probe
            '

      - name: Run native comparison
        shell: bash
        run: |
          set -euo pipefail
          pnpm spike:oci:native -- \
            --image "$IMAGE" \
            --latency-samples "$LATENCY_SAMPLES"

      - name: Publish comparison summary
        if: always()
        shell: bash
        run: |
          comparison="$(find spikes/oci-engine/evidence/native -name comparison.json -print -quit 2>/dev/null || true)"
          if [[ -n "$comparison" ]]; then
            jq . "$comparison"
            {
              echo "## OCI reference-host comparison"
              echo
              echo '```json'
              jq . "$comparison"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable evidence
        if: ${{ always() && hashFiles('spikes/oci-engine/evidence/native/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-reference-host-evidence
          path: spikes/oci-engine/evidence/native/
          if-no-files-found: error
          retention-days: 30
