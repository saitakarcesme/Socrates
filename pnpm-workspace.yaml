packages:
  - apps/*
  - packages/*
  - services/*

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - sharp@0.35.3
  - brace-expansion@5.0.9

overrides:
  brace-expansion@<=5.0.7: 5.0.9
  esbuild@<=0.24.2: 0.25.12
  postcss@<=8.5.17: 8.5.25
  sharp@<0.35.0: 0.35.3
